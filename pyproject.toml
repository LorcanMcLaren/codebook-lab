[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebook-lab"
version = "1.4.0"
description = "An LLM annotation experiment pipeline for computational social science."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  {name = "Lorcan McLaren"},
]
keywords = ["llm", "annotation", "benchmarking", "computational social science", "text-as-data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "codecarbon",
  "krippendorff",
  "langchain-core",
  "langchain-ollama",
  "numpy",
  "pandas",
  "regex",
  "scikit-learn",
  "scipy",
]

[project.optional-dependencies]
textbox = [
  "bert-score",
  "nltk",
  "python-Levenshtein",
  "rouge-score",
  "sentence-transformers",
  "torch",
]
all = ["codebook-lab[textbox]"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/LorcanMcLaren/codebook-lab"
Repository = "https://github.com/LorcanMcLaren/codebook-lab"
Documentation = "https://github.com/LorcanMcLaren/codebook-lab#readme"
DOI = "https://doi.org/10.5281/zenodo.19185921"

[tool.setuptools.packages.find]
include = ["codebook_lab*"]
namespaces = false

[tool.setuptools.package-data]
codebook_lab = ["py.typed", "tasks/*/*.json", "tasks/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
